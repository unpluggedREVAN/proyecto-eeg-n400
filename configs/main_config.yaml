# =====================================================================
# Configuración global del pipeline
# Cambiando valores aquí, todos los notebooks se ajustan.
# =====================================================================

project:
  name: "EEG-N400-Classification"
  authors:
    - "Jose Pablo Agüero Mora"
    - "Roilin Navarro Vargas"
  course: "Inteligencia Artificial - TEC Sede Cartago"

seed: 42

# ---------------------------------------------------------------------
# Rutas
# ---------------------------------------------------------------------
paths:
  project_root_drive: "/content/drive/MyDrive/IA_Proyecto_EEG/proyecto-eeg-n400"
  dataset_root:       "/content/drive/MyDrive/IA_Proyecto_EEG/proyecto-eeg-n400/dataset"
  reports_dir:        "reports"
  figures_dir:        "figures"
  features_dir:       "features"
  models_dir:         "models"
  logs_dir:           "logs"
  # Carpeta donde se guardan las epochs preprocesadas (.fif por sujeto)
  epochs_dir:         "features/epochs_clean"

# ---------------------------------------------------------------------
# Información del dataset
# Valores ACTUALIZADOS tras inspección en Notebook 00.
# ---------------------------------------------------------------------
data:
  sfreq: 256                          # Hz (Muse 2 grabó a 256 Hz, no 250)
  n_channels: 2                       # Solo frontales en los .set procesados
  channels:
    - AF7                             # frontal izq
    - AF8                             # frontal der ★ cluster N400 (Hayes & Magne 2024)

  outliers_behavioral:
    - MU11
    - MU20
    - MU27

  outliers_signal_quality:
    - mu03erp
    - mu09erp
    - mu13erp
    - mu25erp
    - mu27erp
    - mu32erp

  # Sujetos con muy pocos mismatchTarget/Correct (descubierto en Notebook 00)
  # Quedan en el dataset principal; ablation en Notebook 08
  low_mismatch_correct_subjects:
    - mu07erp                         #  3 mismatch correctos
    - mu30erp                         #  7 mismatch correctos
    - mu34erp                         #  7 mismatch correctos

  exclude_outliers_in_main: false

# ---------------------------------------------------------------------
# Etiquetas (eventos de MNE que vamos a usar)
# Los .set ya marcan respuesta correcta con sufijo /Correct
# ---------------------------------------------------------------------
labels:
  match_event:    "matchTarget/Correct"
  mismatch_event: "mismatchTarget/Correct"
  class_map:
    matchTarget/Correct:    0
    mismatchTarget/Correct: 1

# ---------------------------------------------------------------------
# Preprocesamiento (Notebook 01)
# ---------------------------------------------------------------------
preprocessing:
  # Los .set procesados YA ESTÁN filtrados → no se reaplican notch/bandpass
  apply_notch: false
  apply_bandpass: false
  notch_freq: 60.0
  bandpass_low: 0.1
  bandpass_high: 30.0

  # Ventana de epoching (los .set ya vienen con ventana fija ~ -100 a 894 ms)
  epoch_tmin: -0.1
  epoch_tmax:  0.9

  # Baseline correction — se aplica porque los .set vienen sin baseline
  apply_baseline: true
  baseline_tmin: -0.1
  baseline_tmax:  0.0

  # Rechazo de epochs por peak-to-peak
  artifact_rejection_uv: 150.0

  keep_only_correct: true

# ---------------------------------------------------------------------
# Ventana N400 y cluster Hayes & Magne 2024
# ---------------------------------------------------------------------
n400:
  window_tmin: 0.250
  window_tmax: 0.600
  af8_cluster_tmin: 0.250
  af8_cluster_tmax: 0.328

freq_bands:
  delta: [1, 4]
  theta: [4, 8]
  alpha: [8, 13]
  beta:  [13, 30]

splits:
  n_holdout_subjects: 5
  cv_n_splits: 5

optuna:
  n_trials: 200
  timeout_seconds: null
  pruner: "MedianPruner"
  study_name: "eeg_main_tuning"
  storage_relative: "logs/optuna_study.db"

metrics:
  primary: "f1_macro"
  secondary:
    - accuracy
    - roc_auc
    - precision_macro
    - recall_macro
  bootstrap_n_iterations: 1000
  bootstrap_ci_level: 0.95

models_to_compare:
  - logistic_regression
  - svm_rbf
  - random_forest
  - xgboost
  - lightgbm
